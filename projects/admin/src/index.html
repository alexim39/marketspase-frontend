<body>
  <!-- Initial loading screen -->
  <div class="initial-loader" id="initialLoader">
    <div class="loader-brand">
      <div class="loader-logo">
        <img src="/img/x_logo.png">
      </div>
      <div class="loader-brand-name">MarketSpase Control Center (MCC)<!-- Admin --></div>
    </div>
    
    <div class="loader-spinner"></div>
    <div class="loader-text">
      Getting MCC ready...
      <span>Multi-Channel Marketing & Social Commerce marketplace</span>
      <small>Powered by Async</small>
    </div>
  </div>
  
  <!-- Angular app root -->
  <app-root></app-root>
  
  <script>
    // Hide initial loader once the page is fully loaded
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('initialLoader');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => loader.remove(), 300);
        }
      }, 1000);
    });
    
    // Handle Twitter OAuth callback
    if (window.location.pathname === '/auth/twitter/callback') {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      
      if (code) {
        // Store the authorization code for the main window
        sessionStorage.setItem('twitter_auth_code', code);
        window.close();
      } else if (error) {
        sessionStorage.setItem('twitter_auth_error', error);
        window.close();
      }
    }
    
    // Handle Apple OAuth callback
    if (window.location.pathname === '/auth/apple/callback') {
      // Apple Sign-In will handle the callback automatically
      // You might need to implement additional logic here
    }
  </script>
