    <div class="welcome-header">
      <div class="welcome-content">
        <div class="user-greeting">
          <div class="avatar-container">
            <img 
              [src]="user()?.avatar || 'img/avatar.png'" 
              [alt]="user()?.displayName || 'User'" 
              class="user-avatar"
            >
            <div class="online-indicator"></div>
          </div>
          <div class="greeting-text">
            <h1 class="greeting-title">Welcome back, {{ user()?.displayName }}!</h1>
            <p class="dashboard-subtitle">
              {{ getDashboardGreeting() }}
            </p>
          </div>
        </div>
        
        <div class="header-actions">

          <!-- Quick Action Buttons -->
          <div class="quick-action-buttons">
            @if (user()?.role === 'marketer') {
              <button mat-raised-button color="primary" (click)="createCampaign.emit()" class="desktop-action">
                <mat-icon>add</mat-icon>
                <span class="button-text">Create Campaign</span>
              </button>
            }
            @if (user()?.role === 'promoter') {
              <button mat-raised-button color="primary" (click)="browseCampaign.emit()" class="desktop-action">
                <mat-icon>search</mat-icon>
                <span class="button-text">Find Campaigns</span>
              </button>
            }
            <button mat-stroked-button color="accent" (click)="user()?.role === 'promoter' ? viewPromotions.emit() : viewCampaigns.emit()" class="analytics-btn">
              <mat-icon>query_stats</mat-icon>
              <span class="button-text">{{ user()?.role === 'promoter' ? 'Promotion performance' : 'Campaign performance' }}</span>
            </button>
            <button mat-stroked-button color="accent" (click)="withdrawWallet.emit()" class="analytics-btn">
              <mat-icon>account_balance_wallet</mat-icon>
              <span class="button-text">Revenue</span>
            </button>
          </div>
        </div>
      </div>
    </div>
