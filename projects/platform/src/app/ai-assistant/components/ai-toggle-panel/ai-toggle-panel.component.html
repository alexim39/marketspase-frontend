    <mat-card class="toggle-card">
      <div class="toggle-content">
        <mat-slide-toggle
          [checked]="aiEnabled"
          [disabled]="true"
          (change)="toggleAI($event.checked)"
          color="primary"
        >
          <span class="toggle-label">{{ aiEnabled ? 'AI is ON' : 'AI is OFF' }}</span>
        </mat-slide-toggle>
        
        @if (!aiEnabled) {
            <p class="status-text off">
                AI is disabled – all messages will be handled by you
            </p>
            <small class="hint">Turn on AI assistance from the <a [routerLink]="['/dashboard/assistant/settings']">settings page</a></small>
        } @else {
            <p class="status-text">
                AI is currently responding to customers
            </p>
        }

      </div>
    </mat-card>
