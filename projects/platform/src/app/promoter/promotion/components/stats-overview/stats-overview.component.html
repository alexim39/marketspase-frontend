<section class="stats-overview">
  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon total">
          <mat-icon>campaign</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ stats.total }}</h3>
          <p>Total Links</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon pending">
          <mat-icon>link</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ stats.active }}</h3>
          <p>Active Links</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon submitted">
          <mat-icon>touch_app</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ stats.totalClicks }}</h3>
          <p>Total Clicks</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon validated">
          <mat-icon>check_circle</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ stats.billableClicks }}</h3>
          <p>Billable Clicks</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon paid">
          <mat-icon>paid</mat-icon>
        </div>
        <div class="stat-content">
          <h3>{{ stats.earnings | currency:'NGN':'symbol-narrow':'1.0-0' }}</h3>
          <p>Earned</p>
        </div>
      </div>
    </div>
  </div>
</section>
