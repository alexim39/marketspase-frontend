<div class="sms-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title>Send SMS</h2>
    <button mat-icon-button mat-dialog-close aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content>
    <div class="recipient-info"><strong>{{ data.customerName }}</strong><span>{{ data.phone }}</span></div>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Message</mat-label>
      <textarea matInput rows="4" [ngModel]="message()" (ngModelChange)="message.set($event)" maxlength="480" placeholder="Type your message..."></textarea>
      <mat-hint align="end">{{ message().length }}/480 &middot; {{ smsCount() }} page(s)</mat-hint>
    </mat-form-field>
    <div class="cost-footer">
      <span class="cost-label">₦{{ COST_PER_SMS }} per page &middot; {{ smsCount() }} page(s)</span>
      <span class="cost-value">₦{{ totalCost() }}</span>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button [disabled]="sending()" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" [disabled]="sending() || !message().trim()" (click)="send()">
      @if (sending()) { <mat-spinner diameter="18" /> } @else { <mat-icon>send</mat-icon> }
      Send
    </button>
  </mat-dialog-actions>
</div>
