@if (visibleActivity(); as activity) {
  <aside class="feed-live-toast" [class.is-leaving]="isLeaving()" aria-live="polite" aria-label="Latest MarketSpase activity">
    <button class="activity-button" type="button" (click)="openActivity(activity)">
      <span class="activity-icon">
        <mat-icon>{{ iconFor(activity.type) }}</mat-icon>
      </span>

      <img [src]="activity.avatar || 'img/avatar.png'" [alt]="activity.author + ' avatar'" class="activity-avatar" />

      <span class="activity-copy">
        <span class="activity-label">{{ labelFor(activity.type) }} · {{ activity.time }}</span>
        <strong>{{ activity.author }}</strong>
        <span>{{ activity.message }}</span>
      </span>

      <mat-icon class="activity-arrow">chevron_right</mat-icon>
    </button>

    <button class="dismiss-button" type="button" (click)="dismiss(activity, $event)" aria-label="Dismiss live activity">
      <mat-icon>close</mat-icon>
    </button>
  </aside>
}
